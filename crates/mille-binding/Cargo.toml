[package]
name = "mille-binding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Thin napi-rs binding for mille-core."

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# Test-only entry points that deliberately panic, so the suite can assert a
# native panic surfaces as a catchable JS error instead of killing the host
# process. Never enabled for published artifacts — see `build:napi:probe`.
panic-probe = []

[dependencies]
mille-core = { path = "../mille-core" }
bincode.workspace = true
napi.workspace = true
napi-derive.workspace = true
parking_lot.workspace = true
serde.workspace = true
tokio.workspace = true
tokio-util.workspace = true

# Windows has no stable file id on `std::fs::Metadata` (the accessors are
# behind the unstable `windows_by_handle` feature), so undo identity asks the
# kernel through an open handle instead. See `file_id_from_handle`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
napi-build.workspace = true
