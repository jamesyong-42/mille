[package]
name = "fx-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Criterion benches + fixture generators for fx-core."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
fx-core = { path = "../fx-core" }
tempfile.workspace = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "walker"
harness = false

[[bench]]
name = "watcher"
harness = false

[[bench]]
name = "search"
harness = false
