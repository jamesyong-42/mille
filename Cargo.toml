[workspace]
members = [
    "crates/fx-core",
    "crates/fx-binding",
    "crates/fx-bench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jamesyong/file-explorer"

[workspace.dependencies]
# NAPI bindings (3.x as of 2026-04)
napi = { version = "3.8", default-features = false, features = ["napi8", "async", "tokio_rt", "serde-json"] }
napi-derive = "3.2"
napi-build = "2.2"

# Filesystem watching
notify = "6.1"
notify-debouncer-full = "0.3"

# Parallel directory walking
jwalk = "0.8"

# Gitignore matching (ripgrep's crate)
ignore = "0.4"

# Glob matching
globset = "0.4"

# Concurrent data structures
dashmap = "6.1"
arc-swap = "1.7"
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Serialization
# bincode pinned to 2.x with explicit config (see SPEC §4.8, PLAN 13.6)
bincode = { version = "=2.0.1", features = ["serde"] }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }

# Fuzzy matching
nucleo = "0.5"

# Hashing
blake3 = "1.5"

# Memory-mapped IO
memmap2 = "0.9"

# Errors
thiserror = "1.0"

# Small collections
smallvec = { version = "1.13", features = ["const_generics", "union"] }

# Bitflags (for Capability and friends)
bitflags = { version = "2", features = ["serde"] }

# Dev
proptest = "1.5"
tempfile = "3.10"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
