name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  # ------------------------------------------------------------------
  # Rust-only checks (fmt, clippy, tests on host).
  # ------------------------------------------------------------------
  test-rust:
    name: Rust lints & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Exclude mille-binding: cdylib links against Node's N-API and cannot
      # produce a standalone test binary on bare Ubuntu.
      - name: cargo test
        run: cargo test --workspace --exclude mille-binding

  # ------------------------------------------------------------------
  # JS / TS checks on host only.
  # ------------------------------------------------------------------
  test-js:
    name: JS typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version from package.json packageManager (pnpm@10.x)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: js-napi

      # Integration tests load the N-API binary; dist/ is gitignored so we
      # also emit TypeScript before typecheck.
      - name: Build native + TS packages
        run: |
          pnpm --filter @vibecook/mille run build:napi:debug
          pnpm --filter @vibecook/mille run build:ts
          pnpm --filter @vibecook/mille-ui run build

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Test
        run: pnpm -r --if-present test

      - name: FileTree structural invariant bench
        run: pnpm bench:ui

      - name: Repeat live watcher regressions
        shell: bash
        run: |
          for run in $(seq 1 20); do
            echo "watcher repetition ${run}/20"
            node --test packages/mille/test/watcher-host.test.mjs packages/mille/test/watcher-live.test.mjs
          done

      - name: Watcher correctness and latency soak
        run: node packages/mille/bench/watch-soak.mjs --report watch-soak-report.json

      - name: Upload watcher soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watcher-soak-${{ github.sha }}
          path: watch-soak-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Electron renderer quality gate
        run: >-
          xvfb-run --auto-servernum node scripts/watch-bench.mjs
          --operations 120 --seed-files 2000 --exit
          --report electron-watch-bench-report.json

      - name: Upload Electron renderer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-watch-bench-${{ github.sha }}
          path: electron-watch-bench-report.json
          if-no-files-found: warn
          retention-days: 14

      # v0.2 B8 — mille-ui bundle size assertion. Fails CI on regression.
      # Budgets live in `packages/mille-ui/package.json` under
      # `size-limit`; see SPEC §12 for targets.
      - name: mille-ui size check
        run: pnpm --filter @vibecook/mille-ui run size

  # ------------------------------------------------------------------
  # Native build matrix — 8 triples per SPEC §6.2.
  # Each job produces a .node artifact for the corresponding platform.
  # ------------------------------------------------------------------
  build:
    name: Build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-14
            target: aarch64-apple-darwin
            build: pnpm build:napi --target aarch64-apple-darwin

          # Cross-compile on arm64 macos-14 — macos-13 Intel is retired/scarce.
          - host: macos-14
            target: x86_64-apple-darwin
            build: pnpm build:napi --target x86_64-apple-darwin

          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm build:napi --target x86_64-pc-windows-msvc

          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm build:napi --target aarch64-pc-windows-msvc

          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
            build: pnpm build:napi --target x86_64-unknown-linux-gnu --use-napi-cross

          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian-aarch64
            build: pnpm build:napi --target aarch64-unknown-linux-gnu --use-napi-cross

          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
            build: pnpm build:napi --target x86_64-unknown-linux-musl

          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
            build: pnpm build:napi --target aarch64-unknown-linux-musl --use-napi-cross

    steps:
      - uses: actions/checkout@v4

      # Host tooling only for non-docker targets (see release.yml).
      - name: Setup pnpm
        if: ${{ !matrix.settings.docker }}
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: ${{ !matrix.settings.docker }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        if: ${{ !matrix.settings.docker }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache cargo
        if: ${{ !matrix.settings.docker }}
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}

      - name: Install dependencies
        if: ${{ !matrix.settings.docker }}
        run: pnpm install --frozen-lockfile=false

      - name: Build (host)
        if: ${{ !matrix.settings.docker }}
        shell: bash
        run: ${{ matrix.settings.build }}

      - name: Build (docker)
        if: ${{ matrix.settings.docker }}
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ matrix.settings.docker }}
          options: -v ${{ github.workspace }}:/build -w /build -e CI=true
          shell: bash
          run: |
            set -euo pipefail
            export CI=true
            # Alpine images still ship Node 18; @napi-rs/cli needs styleText (Node 20+).
            major=$(node -p "process.versions.node.split('.')[0]")
            if [ "$major" -lt 20 ]; then
              if command -v apk >/dev/null 2>&1; then
                apk add --no-cache curl xz
                arch=$(uname -m)
                case "$arch" in
                  x86_64) node_arch=x64 ;;
                  aarch64) node_arch=arm64 ;;
                  *) echo "unsupported arch: $arch"; exit 1 ;;
                esac
                curl -fsSL "https://unofficial-builds.nodejs.org/download/release/v20.18.1/node-v20.18.1-linux-${node_arch}-musl.tar.gz" \
                  | tar -xz -C /usr/local --strip-components=1
              else
                npm install -g n --force && n 20
                hash -r
              fi
            fi
            node -v
            npm install -g pnpm@10.33.0 --force
            pnpm config set confirmModulesPurge false
            pnpm install --frozen-lockfile=false
            ${{ matrix.settings.build }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            packages/**/*.node
            artifacts/**/*.node
          if-no-files-found: error
          retention-days: 7
